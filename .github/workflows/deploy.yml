name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Fazer o Build (Vite)
        run: npm run build

      - name: Deploy via SSH/rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "=== Testando conectividade SSH ==="
          ssh-keyscan -p 65002 -T 15 -H 187.124.121.200 >> ~/.ssh/known_hosts && echo "ssh-keyscan OK" || echo "ssh-keyscan falhou (continuando mesmo assim)"
          echo "=== Iniciando rsync ==="
          rsync -azv --delete \
            -e "ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -v" \
            ./dist/ \
            u537894463@187.124.121.200:/home/u537894463/domains/gruposeday.com.br/public_html/
          echo "=== Deploy concluido ==="
